<!DOCTYPE html>
<html>
<head>
    <title>NearMiss Dashboard</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f5f5f5; }
        #map-container { width: 100%; height: 500px; background-color: #eee; border: 1px solid #ccc; position: relative; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #4CAF50; color: white; }
    </style>
</head>
<body>
    <h1>NearMiss Dashboard</h1>
    <p>Upload nearmiss_events.geojson to view offline map</p>
    <input type="file" id="file-input" accept=".geojson" />
    
    <div id="map-container">
        <canvas id="map-canvas"></canvas>
    </div>

    <h2>Top Hotspots</h2>
    <table id="hotspots-table">
        <thead>
            <tr>
                <th>Location (Lat, Lon)</th>
                <th>Confirmed Near-misses</th>
                <th>Avg TTC (s)</th>
            </tr>
        </thead>
        <tbody id="hotspots-body">
        </tbody>
    </table>

    <script>
        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const geojson = JSON.parse(e.target.result);
                processGeoJson(geojson);
            };
            reader.readAsText(file);
        });

        function processGeoJson(data) {
            const canvas = document.getElementById('map-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;

            let minLat = 90, maxLat = -90, minLon = 180, maxLon = -180;
            const validFeatures = data.features.filter(f => f.geometry && f.geometry.coordinates);
            
            if(validFeatures.length === 0) return;

            validFeatures.forEach(f => {
                const lon = f.geometry.coordinates[0];
                const lat = f.geometry.coordinates[1];
                if (lat < minLat) minLat = lat;
                if (lat > maxLat) maxLat = lat;
                if (lon < minLon) minLon = lon;
                if (lon > maxLon) maxLon = lon;
            });

            // Add margin
            const latRange = maxLat - minLat || 0.01;
            const lonRange = maxLon - minLon || 0.01;
            minLat -= latRange * 0.1;
            maxLat += latRange * 0.1;
            minLon -= lonRange * 0.1;
            maxLon += lonRange * 0.1;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Group by simple grid for hotspots
            const gridSize = 0.001; // roughly 110m
            const grid = {};

            validFeatures.forEach(f => {
                const lon = f.geometry.coordinates[0];
                const lat = f.geometry.coordinates[1];
                const confirmed = f.properties.confirmed;
                const ttc = f.properties.ttc;

                const x = (lon - minLon) / (maxLon - minLon) * canvas.width;
                const y = canvas.height - ((lat - minLat) / (maxLat - minLat) * canvas.height);

                ctx.beginPath();
                ctx.arc(x, y, 5, 0, 2 * Math.PI);
                ctx.fillStyle = confirmed ? 'red' : 'orange';
                ctx.fill();

                if (confirmed) {
                    const gridX = Math.floor(lon / gridSize) * gridSize;
                    const gridY = Math.floor(lat / gridSize) * gridSize;
                    const key = `${gridY.toFixed(4)},${gridX.toFixed(4)}`;
                    if(!grid[key]) grid[key] = { count: 0, sumTtc: 0 };
                    grid[key].count++;
                    grid[key].sumTtc += ttc;
                }
            });

            const hotspots = Object.keys(grid).map(k => ({
                loc: k,
                count: grid[k].count,
                avgTtc: grid[k].sumTtc / grid[k].count
            })).sort((a, b) => b.count - a.count);

            const tbody = document.getElementById('hotspots-body');
            tbody.innerHTML = '';
            hotspots.forEach(h => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${h.loc}</td><td>${h.count}</td><td>${h.avgTtc.toFixed(2)}</td>`;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
